<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자습 통계 대시보드</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg:#0f1419; --surface:#1a1d29; --surface2:#2d3142;
  --border:rgba(255,255,255,0.07); --border-h:rgba(255,255,255,0.15);
  --accent:#667eea; --accent-dim:rgba(102,126,234,0.12);
  --blue:#60a5fa; --green:#34d399; --red:#f87171; --purple:#764ba2;
  --text:#e2e8f0; --text-muted:#64748b;
  --r:14px;
}
html,body { height: 100%; font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); }
body { background-image: radial-gradient(ellipse 60% 40% at 50% -10%, rgba(102,126,234,0.06) 0%, transparent 70%); }
.container { max-width: 1200px; margin: 0 auto; padding: 24px; }

.header { text-align: center; margin-bottom: 40px; }
.header h1 {
  font-size: 32px; font-weight: 900; margin-bottom: 8px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header p { color: var(--text-muted); font-size: 14px; }
.back-btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  color: var(--text); text-decoration: none; font-size: 14px; font-weight: 600;
  transition: all 0.2s;
}
.back-btn:hover { border-color: var(--accent); transform: translateY(-2px); }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 32px; }
.stat-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 24px;
  transition: all 0.3s;
}
.stat-card:hover { border-color: var(--accent); transform: translateY(-4px); box-shadow: 0 8px 24px rgba(102,126,234,0.15); }
.stat-icon { font-size: 32px; margin-bottom: 12px; }
.stat-label { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
.stat-value { font-size: 28px; font-weight: 900; color: var(--text); }
.stat-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

.chart-section { margin-bottom: 32px; }
.chart-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 24px;
}
.chart-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
.chart-container { position: relative; height: 300px; }

.loading { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.spinner {
  display: inline-block; width: 40px; height: 40px; border: 3px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.date-picker {
  display: flex; align-items: center; gap: 12px; margin-bottom: 24px; padding: 16px;
  background: var(--surface2); border-radius: var(--r);
}
.date-picker label { font-size: 13px; font-weight: 600; color: var(--text-muted); }
.date-picker input {
  padding: 8px 12px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-size: 14px;
}
.date-picker button {
  padding: 8px 16px; background: linear-gradient(135deg, #667eea, #764ba2);
  border: none; border-radius: 8px; color: white; font-weight: 600;
  cursor: pointer; transition: all 0.2s;
}
.date-picker button:hover { transform: scale(1.05); }
</style>
</head>
<body>
<div class="container">
  <div style="margin-bottom: 24px;">
    <a href="index.html" class="back-btn">← 자습 기록으로 돌아가기</a>
  </div>

  <div class="header">
    <h1>📊 자습 통계 대시보드</h1>
    <p>3학년 2반 자습 활동 분석</p>
  </div>

  <div class="date-picker">
    <label>📅 기간 선택:</label>
    <input type="date" id="start-date">
    <span style="color: var(--text-muted);">~</span>
    <input type="date" id="end-date">
    <button onclick="loadStats()">조회</button>
  </div>

  <div class="date-picker">
    <label>👤 학생 선택:</label>
    <select id="student-select" onchange="toggleStudentStats()" style="padding: 8px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; min-width: 150px;">
      <option value="">전체 학급</option>
    </select>
    <span style="color: var(--text-muted); font-size: 12px;">개인 통계를 보려면 학생을 선택하세요</span>
  </div>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p style="margin-top: 16px;">데이터를 불러오는 중...</p>
  </div>

  <div id="content" style="display: none;">
    <!-- 요약 카드 -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">✅</div>
        <div class="stat-label">평균 출석률</div>
        <div class="stat-value" id="attendance-rate">0%</div>
        <div class="stat-sub" id="attendance-sub"></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">⏱️</div>
        <div class="stat-label">평균 공부 시간</div>
        <div class="stat-value" id="avg-study-time">0분</div>
        <div class="stat-sub" id="time-sub"></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🏆</div>
        <div class="stat-label">총 자습 일수</div>
        <div class="stat-value" id="total-days">0일</div>
        <div class="stat-sub" id="days-sub"></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">📚</div>
        <div class="stat-label">총 공부 시간</div>
        <div class="stat-value" id="total-hours">0시간</div>
        <div class="stat-sub" id="hours-sub"></div>
      </div>
    </div>

    <!-- 과목별 통계 차트 -->
    <div class="chart-section">
      <div class="chart-card">
        <div class="chart-title">📖 과목별 공부 시간</div>
        <div class="chart-container">
          <canvas id="subject-chart"></canvas>
        </div>
      </div>
    </div>

    <!-- 일별 추이 차트 -->
    <div class="chart-section">
      <div class="chart-card">
        <div class="chart-title">📈 일별 공부 시간 추이</div>
        <div class="chart-container">
          <canvas id="daily-chart"></canvas>
        </div>
      </div>
    </div>

    <!-- 학생별 순위 차트 -->
    <div class="chart-section" id="class-stats">
      <div class="chart-card">
        <div class="chart-title">👥 학생별 총 공부 시간</div>
        <div class="chart-container">
          <canvas id="student-chart"></canvas>
        </div>
      </div>
    </div>

    <!-- 개인별 상세 통계 -->
    <div id="individual-stats" style="display: none;">
      <div style="text-align: center; margin: 32px 0;">
        <h2 style="font-size: 24px; font-weight: 700; margin-bottom: 8px;">
          <span id="student-name-title"></span>님의 자습 통계
        </h2>
        <p style="color: var(--text-muted); font-size: 14px;">개인별 상세 분석</p>
      </div>

      <!-- 개인 요약 카드 -->
      <div class="stats-grid" style="margin-bottom: 32px;">
        <div class="stat-card">
          <div class="stat-icon">📅</div>
          <div class="stat-label">출석 일수</div>
          <div class="stat-value" id="ind-attendance">0일</div>
          <div class="stat-sub" id="ind-attendance-sub"></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">⏱️</div>
          <div class="stat-label">총 공부 시간</div>
          <div class="stat-value" id="ind-total-time">0시간</div>
          <div class="stat-sub" id="ind-total-sub"></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">📊</div>
          <div class="stat-label">하루 평균</div>
          <div class="stat-value" id="ind-avg-time">0분</div>
          <div class="stat-sub" id="ind-avg-sub"></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🏆</div>
          <div class="stat-label">학급 순위</div>
          <div class="stat-value" id="ind-rank">-</div>
          <div class="stat-sub" id="ind-rank-sub"></div>
        </div>
      </div>

      <!-- 개인 과목별 차트 -->
      <div class="chart-section">
        <div class="chart-card">
          <div class="chart-title">📖 과목별 공부 시간 (개인)</div>
          <div class="chart-container">
            <canvas id="ind-subject-chart"></canvas>
          </div>
        </div>
      </div>

      <!-- 개인 일별 추이 -->
      <div class="chart-section">
        <div class="chart-card">
          <div class="chart-title">📈 일별 공부 시간 추이 (개인)</div>
          <div class="chart-container">
            <canvas id="ind-daily-chart"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyt7mre-1Lw4bw2Duj78YTXKB2OPsu3QzXg_bR0s2D_bJ8eC6Ioqksadkn8d4nFqtk_RQ/exec';
var allRecords = [];
var allStudents = [];

// 한국 시간 날짜
function kstDate() {
  var d = new Date();
  var kst = new Date(d.getTime() + (9 * 60 * 60 * 1000));
  var y = kst.getUTCFullYear(), m = kst.getUTCMonth() + 1, day = kst.getUTCDate();
  return y + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
}

// 초기 날짜 설정 (최근 30일)
window.onload = function() {
  var today = kstDate();
  var start = new Date();
  start.setDate(start.getDate() - 30);
  var startStr = start.toISOString().split('T')[0];

  document.getElementById('end-date').value = today;
  document.getElementById('start-date').value = startStr;

  // 학생 목록 로드
  loadStudents();
  loadStats();
};

// 학생 목록 로드
function loadStudents() {
  fetch(SCRIPT_URL + '?action=getStudents')
    .then(res => res.json())
    .then(students => {
      allStudents = students;
      var select = document.getElementById('student-select');
      students.forEach(s => {
        var option = document.createElement('option');
        option.value = s.name;
        option.textContent = s.num + '. ' + s.name;
        select.appendChild(option);
      });
    })
    .catch(err => console.error('학생 목록 로드 실패:', err));
}

// 통계 로드
function loadStats() {
  var start = document.getElementById('start-date').value;
  var end = document.getElementById('end-date').value;

  if (!start || !end) {
    alert('시작일과 종료일을 선택해주세요.');
    return;
  }

  document.getElementById('loading').style.display = 'block';
  document.getElementById('content').style.display = 'none';

  fetch(SCRIPT_URL + '?action=getRecordsRange&start=' + start + '&end=' + end)
    .then(res => res.json())
    .then(records => {
      allRecords = records;
      var selectedStudent = document.getElementById('student-select').value;

      if (selectedStudent) {
        processIndividualStats(records, selectedStudent);
      } else {
        processStats(records);
      }

      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').style.display = 'block';
    })
    .catch(err => {
      console.error(err);
      alert('데이터를 불러오는데 실패했습니다.');
      document.getElementById('loading').style.display = 'none';
    });
}

// 학생 선택 변경
function toggleStudentStats() {
  var selectedStudent = document.getElementById('student-select').value;

  if (selectedStudent) {
    processIndividualStats(allRecords, selectedStudent);
  } else {
    processStats(allRecords);
  }
}

// 시간 계산
function calcDuration(checkin, checkout) {
  var t1 = checkin.split(':');
  var t2 = checkout.split(':');
  var m1 = parseInt(t1[0]) * 60 + parseInt(t1[1]);
  var m2 = parseInt(t2[0]) * 60 + parseInt(t2[1]);
  return m2 >= m1 ? m2 - m1 : 0;
}

// 과목 파싱
function parseSubjects(content) {
  var subjects = {};
  var lines = content.split('\n');
  var current = '기타';

  lines.forEach(line => {
    if (line.includes('국어')) current = '국어';
    else if (line.includes('영어')) current = '영어';
    else if (line.includes('수학')) current = '수학';
    else if (line.includes('과학')) current = '과학';
    else if (line.includes('사회')) current = '사회';

    var match = line.match(/(\d+)분/);
    if (match) {
      if (!subjects[current]) subjects[current] = 0;
      subjects[current] += parseInt(match[1]);
    }
  });

  return subjects;
}

// 과목별 차트
var subjectChartInstance = null;
function createSubjectChart(data) {
  var ctx = document.getElementById('subject-chart').getContext('2d');

  if (subjectChartInstance) subjectChartInstance.destroy();

  subjectChartInstance = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: Object.keys(data),
      datasets: [{
        data: Object.values(data),
        backgroundColor: ['#667eea', '#764ba2', '#60a5fa', '#34d399', '#f59e0b', '#f87171']
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: 'bottom',
          labels: { color: '#e2e8f0', font: { family: 'Noto Sans KR' } }
        }
      }
    }
  });
}

// 일별 차트
var dailyChartInstance = null;
function createDailyChart(data) {
  var ctx = document.getElementById('daily-chart').getContext('2d');

  if (dailyChartInstance) dailyChartInstance.destroy();

  var sortedDates = Object.keys(data).sort();
  var values = sortedDates.map(d => Math.round(data[d] / 60));

  dailyChartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: sortedDates.map(d => d.substring(5)),
      datasets: [{
        label: '공부 시간 (시간)',
        data: values,
        borderColor: '#667eea',
        backgroundColor: 'rgba(102,126,234,0.1)',
        tension: 0.4,
        fill: true
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          labels: { color: '#e2e8f0', font: { family: 'Noto Sans KR' } }
        }
      },
      scales: {
        x: { ticks: { color: '#64748b' }, grid: { color: 'rgba(255,255,255,0.05)' } },
        y: { ticks: { color: '#64748b' }, grid: { color: 'rgba(255,255,255,0.05)' } }
      }
    }
  });
}

// 학생별 차트
var studentChartInstance = null;
function createStudentChart(data) {
  var ctx = document.getElementById('student-chart').getContext('2d');

  if (studentChartInstance) studentChartInstance.destroy();

  var sorted = Object.entries(data).sort((a, b) => b[1] - a[1]);
  var names = sorted.map(s => s[0]);
  var values = sorted.map(s => Math.round(s[1] / 60));

  studentChartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: names,
      datasets: [{
        label: '총 공부 시간 (시간)',
        data: values,
        backgroundColor: 'rgba(102,126,234,0.7)',
        borderColor: '#667eea',
        borderWidth: 1
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          labels: { color: '#e2e8f0', font: { family: 'Noto Sans KR' } }
        }
      },
      scales: {
        x: { ticks: { color: '#64748b' }, grid: { color: 'rgba(255,255,255,0.05)' } },
        y: { ticks: { color: '#64748b' }, grid: { color: 'rgba(255,255,255,0.05)' } }
      }
    }
  });
}

// 개인별 통계 처리
function processIndividualStats(records, studentName) {
  // UI 전환
  document.getElementById('class-stats').style.display = 'none';
  document.getElementById('individual-stats').style.display = 'block';
  document.getElementById('student-name-title').textContent = studentName;

  // 해당 학생 기록만 필터링
  var studentRecords = records.filter(r => r.name === studentName);

  // 전체 학생별 시간 계산 (순위용)
  var allStudentTime = {};
  records.forEach(r => {
    if (r.checkin && r.checkout) {
      var mins = calcDuration(r.checkin, r.checkout);
      if (!allStudentTime[r.name]) allStudentTime[r.name] = 0;
      allStudentTime[r.name] += mins;
    }
  });

  // 순위 계산
  var sorted = Object.entries(allStudentTime).sort((a, b) => b[1] - a[1]);
  var rank = sorted.findIndex(s => s[0] === studentName) + 1;
  var totalStudents = sorted.length;

  // 개인 통계 계산
  var totalMinutes = 0;
  var uniqueDates = new Set();
  var subjectTime = { 국어: 0, 영어: 0, 수학: 0, 과학: 0, 사회: 0, 기타: 0 };
  var dailyTime = {};

  studentRecords.forEach(r => {
    if (r.checkin && r.checkout) {
      var mins = calcDuration(r.checkin, r.checkout);
      totalMinutes += mins;
      uniqueDates.add(r.date);

      // 일별
      if (!dailyTime[r.date]) dailyTime[r.date] = 0;
      dailyTime[r.date] += mins;

      // 과목별
      if (r.content) {
        var subjects = parseSubjects(r.content);
        Object.keys(subjects).forEach(subj => {
          if (subjectTime[subj] !== undefined) {
            subjectTime[subj] += subjects[subj];
          } else {
            subjectTime['기타'] += subjects[subj];
          }
        });
      }
    }
  });

  var attendanceDays = uniqueDates.size;
  var totalHours = Math.round(totalMinutes / 60);
  var avgMinutes = attendanceDays > 0 ? Math.round(totalMinutes / attendanceDays) : 0;

  // 요약 카드 업데이트
  document.getElementById('ind-attendance').textContent = attendanceDays + '일';
  document.getElementById('ind-attendance-sub').textContent = studentRecords.length + '건 기록';
  document.getElementById('ind-total-time').textContent = totalHours + '시간';
  document.getElementById('ind-total-sub').textContent = totalMinutes + '분';
  document.getElementById('ind-avg-time').textContent = avgMinutes + '분';
  document.getElementById('ind-avg-sub').textContent = '하루 평균';
  document.getElementById('ind-rank').textContent = rank + '등';
  document.getElementById('ind-rank-sub').textContent = '전체 ' + totalStudents + '명 중';

  // 차트 생성
  createIndSubjectChart(subjectTime);
  createIndDailyChart(dailyTime);
}

// 전체 학급 통계 처리 (기존)
function processStats(records) {
  // UI 전환
  document.getElementById('class-stats').style.display = 'block';
  document.getElementById('individual-stats').style.display = 'none';

  // 기존 로직...
  var totalRecords = records.length;
  var totalMinutes = 0;
  var uniqueDates = new Set();
  var subjectTime = { 국어: 0, 영어: 0, 수학: 0, 과학: 0, 사회: 0, 기타: 0 };
  var studentTime = {};
  var dailyTime = {};

  records.forEach(r => {
    if (r.checkin && r.checkout) {
      var mins = calcDuration(r.checkin, r.checkout);
      totalMinutes += mins;
      uniqueDates.add(r.date);

      if (!studentTime[r.name]) studentTime[r.name] = 0;
      studentTime[r.name] += mins;

      if (!dailyTime[r.date]) dailyTime[r.date] = 0;
      dailyTime[r.date] += mins;

      if (r.content) {
        var subjects = parseSubjects(r.content);
        Object.keys(subjects).forEach(subj => {
          if (subjectTime[subj] !== undefined) {
            subjectTime[subj] += subjects[subj];
          } else {
            subjectTime['기타'] += subjects[subj];
          }
        });
      }
    }
  });

  var avgMinutes = totalRecords > 0 ? Math.round(totalMinutes / totalRecords) : 0;
  var totalDays = uniqueDates.size;
  var totalHours = Math.round(totalMinutes / 60);
  var attendanceRate = totalRecords > 0 ? Math.round((totalRecords / (totalDays * 14)) * 100) : 0;

  document.getElementById('attendance-rate').textContent = attendanceRate + '%';
  document.getElementById('attendance-sub').textContent = totalRecords + '건 기록';
  document.getElementById('avg-study-time').textContent = avgMinutes + '분';
  document.getElementById('time-sub').textContent = '1인당 평균';
  document.getElementById('total-days').textContent = totalDays + '일';
  document.getElementById('days-sub').textContent = '자습 일수';
  document.getElementById('total-hours').textContent = totalHours + '시간';
  document.getElementById('hours-sub').textContent = '전체 합계';

  createSubjectChart(subjectTime);
  createDailyChart(dailyTime);
  createStudentChart(studentTime);
}

// 개인 과목별 차트
var indSubjectChartInstance = null;
function createIndSubjectChart(data) {
  var ctx = document.getElementById('ind-subject-chart').getContext('2d');

  if (indSubjectChartInstance) indSubjectChartInstance.destroy();

  indSubjectChartInstance = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: Object.keys(data),
      datasets: [{
        data: Object.values(data),
        backgroundColor: ['#667eea', '#764ba2', '#60a5fa', '#34d399', '#f59e0b', '#f87171']
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: 'bottom',
          labels: { color: '#e2e8f0', font: { family: 'Noto Sans KR' } }
        }
      }
    }
  });
}

// 개인 일별 차트
var indDailyChartInstance = null;
function createIndDailyChart(data) {
  var ctx = document.getElementById('ind-daily-chart').getContext('2d');

  if (indDailyChartInstance) indDailyChartInstance.destroy();

  var sortedDates = Object.keys(data).sort();
  var values = sortedDates.map(d => Math.round(data[d] / 60));

  indDailyChartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: sortedDates.map(d => d.substring(5)),
      datasets: [{
        label: '공부 시간 (시간)',
        data: values,
        borderColor: '#764ba2',
        backgroundColor: 'rgba(118,75,162,0.1)',
        tension: 0.4,
        fill: true
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          labels: { color: '#e2e8f0', font: { family: 'Noto Sans KR' } }
        }
      },
      scales: {
        x: { ticks: { color: '#64748b' }, grid: { color: 'rgba(255,255,255,0.05)' } },
        y: { ticks: { color: '#64748b' }, grid: { color: 'rgba(255,255,255,0.05)' } }
      }
    }
  });
}
</script>
